---
# roles/security/tasks/ssh.yml

- name: Enforce secure SSH daemon configuration
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: /usr/sbin/sshd -t -f %s
  loop:
    - { regexp: '^(#\s*)?PermitRootLogin', line: 'PermitRootLogin no' }
    - { regexp: '^(#\s*)?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^(#\s*)?PermitEmptyPasswords', line: 'PermitEmptyPasswords no' }
    - { regexp: '^(#\s*)?MaxAuthTries', line: 'MaxAuthTries 3' }
    - { regexp: '^(#\s*)?ClientAliveInterval', line: 'ClientAliveInterval 300' }
    - { regexp: '^(#\s*)?ClientAliveCountMax', line: 'ClientAliveCountMax 2' }
    - { regexp: '^(#\s*)?X11Forwarding', line: 'X11Forwarding no' }
    - { regexp: '^(#\s*)?AllowTcpForwarding', line: 'AllowTcpForwarding no' }
    - { regexp: '^(#\s*)?AllowAgentForwarding', line: 'AllowAgentForwarding no' }
    - { regexp: '^(#\s*)?LogLevel', line: 'LogLevel VERBOSE' }
    - { regexp: '^(#\s*)?MaxSessions', line: 'MaxSessions 2' }
    - { regexp: '^(#\s*)?TCPKeepAlive', line: 'TCPKeepAlive no' }
    - { regexp: '^(#\s*)?Banner', line: 'Banner /etc/issue.net' }
  notify: Reload SSH daemon
