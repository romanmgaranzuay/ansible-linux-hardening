---
# roles/security/tasks/auditd.yml

- name: Install audit daemon packages
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Enable and start auditd service
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: yes

- name: Configure core audit rules
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/99-hardening.rules
    content: |
      # Delete all existing rules
      -D

      # Set buffer size
      -b 8192

      # Failure mode (1 = printk, 2 = panic)
      -f 1

      # Audit changes to user/group databases
      -w /etc/group -p wa -k identity
      -w /etc/passwd -p wa -k identity
      -w /etc/gshadow -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/security/opasswd -p wa -k identity

      # Audit sudoers configuration changes
      -w /etc/sudoers -p wa -k sudoers_changes
      -w /etc/sudoers.d/ -p wa -k sudoers_changes

      # Audit modifications to system network configurations
      -w /etc/hosts -p wa -k system_locale
      -w /etc/network/ -p wa -k system_locale

      # Make configuration immutable (requires reboot to alter rules)
      -e 2
    owner: root
    group: root
    mode: '0600'
  notify: Restart auditd
